name: Validate puzzle levels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run behavioral and 50-level regression tests
        run: python -m unittest -v
      - name: Audit and replay all levels
        run: python validate.py levels.json --output report.json
